name: My Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Get My Code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Build Spring Boot application
      - name: Build Spring Boot Application
        run: mvn clean package -DskipTests

      # 4. SonarQube scan
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=nebasishp
          -Dsonar.projectKey=nebasishp_hello-eks-pipeline
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      # 5. Build Docker image with Git commit SHA as tag
      - name: Build Docker Image
        run: |
          docker build \
            -t hello-eks-pipeline:${{ github.sha }} .

      # 6. Debug GitHub context
      - name: Debug GitHub Context
        run: |
          echo "repository=${{ github.repository }}"
          echo "ref=${{ github.ref }}"
          echo "event=${{ github.event_name }}"
          echo "commit=${{ github.sha }}"

      # 7. Show actual OIDC subject
      - name: Show Actual OIDC Subject
        shell: bash
        run: |
          RESPONSE=$(curl -sLS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")

          export TOKEN

          python3 <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload.encode()).decode()
          )

          print("OIDC aud =", claims.get("aud"))
          print("OIDC sub =", claims.get("sub"))
          print("repository =", claims.get("repository"))
          print("repository_id =", claims.get("repository_id"))
          print("repository_owner =", claims.get("repository_owner"))
          print("repository_owner_id =", claims.get("repository_owner_id"))
          print("ref =", claims.get("ref"))
          PY

      # 8. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434655688160:role/hello-eks-github-role
          aws-region: ap-south-1

      # 9. Verify AWS identity
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 10. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 11. Tag and push Docker image to ECR
      - name: Tag and Push Docker Image to ECR
        run: |
          docker tag \
            hello-eks-pipeline:${{ github.sha }} \
            434655688160.dkr.ecr.ap-south-1.amazonaws.com/hello-eks-pipeline:${{ github.sha }}

          docker push \
            434655688160.dkr.ecr.ap-south-1.amazonaws.com/hello-eks-pipeline:${{ github.sha }}

      # 12. Connect GitHub runner to EKS
      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name hello-eks-cluster

      # 13. Verify EKS connection
      - name: Verify EKS Connection
        run: kubectl get nodes

      # 14. Apply Kubernetes base resources
      - name: Apply Kubernetes Resources
        run: |
          kubectl apply -f k8s/service-account.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/deployment.yml

      # 15. Replace deployment image with current Git commit image
      - name: Deploy Current Git Version
        run: |
          kubectl set image deployment/hello-eks-deployment \
            hello-eks-container=434655688160.dkr.ecr.ap-south-1.amazonaws.com/hello-eks-pipeline:${{ github.sha }}

      # 16. Wait for rollout to complete
      - name: Verify Deployment Rollout
        run: |
          kubectl rollout status deployment/hello-eks-deployment \
            --timeout=180s

      # 17. Show final resources
      - name: Show EKS Resources
        run: |
          kubectl get nodes
          kubectl get deployments
          kubectl get pods -o wide
          kubectl get svc