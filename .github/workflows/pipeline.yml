name: My Pipeline

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Get My Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Spring Boot Application
        run: mvn clean package