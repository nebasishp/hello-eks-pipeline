name: Blue Green EKS Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: hello-eks-cluster
  ECR_REPOSITORY: hello-eks-pipeline
  ECR_REGISTRY: 434655688160.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Get My Code
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA
      # =========================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      # =========================================================
      # 3. MAVEN BUILD
      # =========================================================
      - name: Build Spring Boot Application
        run: mvn clean package -DskipTests


      # =========================================================
      # 4. SONAR
      # =========================================================
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=nebasishp
          -Dsonar.projectKey=nebasishp_hello-eks-pipeline
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}


      # =========================================================
      # 5. BUILD DOCKER IMAGE
      # Each Git commit gets its own Docker image
      # =========================================================
      - name: Build Docker Image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} .


      # =========================================================
      # 6. AWS LOGIN USING GITHUB OIDC
      # =========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::434655688160:role/hello-eks-github-role
          aws-region: ${{ env.AWS_REGION }}


      # =========================================================
      # 7. VERIFY AWS LOGIN
      # =========================================================
      - name: Verify AWS Identity
        run: aws sts get-caller-identity


      # =========================================================
      # 8. LOGIN TO ECR
      # =========================================================
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # =========================================================
      # 9. TAG + PUSH IMAGE TO ECR
      # =========================================================
      - name: Push Docker Image to ECR
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}


      # =========================================================
      # 10. CONNECT TO EKS
      # =========================================================
      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER


      # =========================================================
      # 11. VERIFY EKS
      # =========================================================
      - name: Verify EKS Connection
        run: |
          kubectl get nodes


      # =========================================================
      # 12. FIND WHICH COLOR IS CURRENTLY LIVE
      #
      # Example:
      #
      # Service = blue
      # Therefore:
      # ACTIVE   = blue
      # INACTIVE = green
      #
      # New version will go to GREEN.
      # =========================================================
      - name: Find Active and Inactive Color
        id: colors
        shell: bash
        run: |
          ACTIVE=$(kubectl get service hello-eks-service \
            -o jsonpath='{.spec.selector.version}')

          echo "Current active color = $ACTIVE"

          if [ "$ACTIVE" = "blue" ]; then
            INACTIVE="green"
          else
            INACTIVE="blue"
          fi

          echo "New version will deploy to = $INACTIVE"

          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "inactive=$INACTIVE" >> "$GITHUB_OUTPUT"


      # =========================================================
      # 13. DEPLOY NEW IMAGE TO INACTIVE COLOR
      #
      # If BLUE is live:
      # update GREEN
      #
      # If GREEN is live:
      # update BLUE
      # =========================================================
      - name: Deploy New Version to Inactive Color
        shell: bash
        run: |
          INACTIVE="${{ steps.colors.outputs.inactive }}"

          kubectl set image \
            deployment/hello-eks-$INACTIVE \
            hello-eks-container=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}


      # =========================================================
      # 14. WAIT UNTIL NEW VERSION IS HEALTHY
      #
      # IMPORTANT:
      # Traffic has NOT switched yet.
      # Users are still using old version.
      # =========================================================
      - name: Wait for New Version
        shell: bash
        run: |
          INACTIVE="${{ steps.colors.outputs.inactive }}"

          kubectl rollout status \
            deployment/hello-eks-$INACTIVE \
            --timeout=180s


      # =========================================================
      # 15. SHOW BOTH BLUE AND GREEN
      # =========================================================
      - name: Show Blue Green Pods
        run: |
          kubectl get pods \
            -l app=hello-eks \
            -o wide \
            --show-labels


      # =========================================================
      # 16. SWITCH LIVE TRAFFIC
      #
      # This is the actual Blue-Green switch.
      #
      # Service:
      # blue → green
      #
      # OR
      #
      # green → blue
      # =========================================================
      - name: Switch Traffic to New Version
        shell: bash
        run: |
          INACTIVE="${{ steps.colors.outputs.inactive }}"

          kubectl patch service hello-eks-service \
            --type merge \
            -p "{\"spec\":{\"selector\":{\"app\":\"hello-eks\",\"version\":\"$INACTIVE\"}}}"


      # =========================================================
      # 17. VERIFY SERVICE SELECTOR
      # =========================================================
      - name: Verify Active Color
        run: |
          echo "Service is now pointing to:"

          kubectl get service hello-eks-service \
            -o jsonpath='{.spec.selector.version}'

          echo ""


      # =========================================================
      # 18. VERIFY SERVICE ENDPOINT
      # =========================================================
      - name: Verify Service Endpoint
        run: |
          kubectl get endpoints hello-eks-service


      # =========================================================
      # 19. FINAL STATUS
      # =========================================================
      - name: Final Deployment Status
        run: |
          echo "=============================="
          echo "BLUE GREEN DEPLOYMENT COMPLETE"
          echo "=============================="

          kubectl get deployments

          echo ""
          kubectl get pods -o wide

          echo ""
          kubectl get svc hello-eks-service